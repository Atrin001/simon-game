<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simon</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css?family=Press+Start+2P" rel="stylesheet">
</head>

<body>
  <h1 id="level-title">Press A Key or Tap Start</h1>
  <button id="start-btn">Start Game</button>


  <div class="container">
    <div id="green" class="btn green"></div>
    <div id="red" class="btn red"></div>
    <div id="yellow" class="btn yellow"></div>
    <div id="blue" class="btn blue"></div>
  </div>

  <!-- jQuery (must come before your JS) -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <!-- Your game script -->
  <script src="index.js"></script>
</body>

</html>
